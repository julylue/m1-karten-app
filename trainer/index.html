<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Klausurtrainer</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Klausurtrainer">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="robots" content="noindex">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@500;600;700&family=Hanken+Grotesk:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap">
<style>
:root{
  --bg:#F3F5F8; --surface:#FFFFFF; --sunk:#E9EDF2; --ink:#1B2230; --muted:#5A6475; --line:#D9DEE6;
  --accent:#C96F12; --accent-ink:#9A5209; --accent-soft:#F6E3CC; --accent-mid:#E9B77D;
  --ok:#2E7A4F; --ok-soft:#DDF0E4; --bad:#B23B3B; --bad-soft:#F7E0E0; --warn:#8A6A00; --warn-soft:#FBF0CC;
  --shadow:0 1px 2px rgba(20,30,50,.06),0 4px 16px rgba(20,30,50,.05);
  --display:"Familjen Grotesk","Hanken Grotesk",system-ui,sans-serif;
  --body:"Hanken Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#11151C; --surface:#1A2029; --sunk:#232A35; --ink:#E7EAF0; --muted:#9AA3B2; --line:#2E3643;
    --accent:#EE9A3C; --accent-ink:#F3B06A; --accent-soft:#3A2A17; --accent-mid:#8A5A26;
    --ok:#5CC08A; --ok-soft:#173226; --bad:#EE7B7B; --bad-soft:#3A1D1F; --warn:#E6C35A; --warn-soft:#352C12;
    --shadow:none;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#11151C; --surface:#1A2029; --sunk:#232A35; --ink:#E7EAF0; --muted:#9AA3B2; --line:#2E3643;
  --accent:#EE9A3C; --accent-ink:#F3B06A; --accent-soft:#3A2A17; --accent-mid:#8A5A26;
  --ok:#5CC08A; --ok-soft:#173226; --bad:#EE7B7B; --bad-soft:#3A1D1F; --warn:#E6C35A; --warn-soft:#352C12;
  --shadow:none;
}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55;padding-inline:16px;padding-block:0 48px}
.wrap{max-width:760px;margin:0 auto}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;line-height:1.2}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:.85em}
.muted{color:var(--muted)}
.label{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}

/* header */
.top{background:var(--bg);display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:14px 6px}
.brand{white-space:nowrap;font-family:var(--display);font-weight:700;font-size:18px;letter-spacing:-.01em}
.brand span{color:var(--accent)}
.sync{font-size:12px;max-width:180px;color:var(--muted);text-align:right}

/* buttons */
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 16px;font-weight:600}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
:root[data-theme="dark"] .btn.primary{color:#1B1206}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn.primary{color:#1B1206}}
.btn.ghost{background:transparent}
.btn:disabled{opacity:.45;cursor:default}
.linkbtn{background:none;border:none;padding:0;color:var(--accent-ink);font-weight:600;text-decoration:underline;text-underline-offset:3px}

/* home: festigen */
.hero{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px;box-shadow:var(--shadow);display:grid;gap:14px;margin-bottom:28px}
.hero-row{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px}
.bigfig{font-family:var(--display);font-size:40px;font-weight:700;line-height:1;color:var(--accent-ink)}
.overall{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:14px}
.overall b{font-family:var(--mono);font-weight:500}
.key{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:0}
.k-fest{background:var(--accent)} .k-bek{background:var(--accent-mid)} .k-neu{background:var(--sunk);border:1px solid var(--line)}

/* chapters */
.chap{margin-bottom:26px}
.chap-h{display:flex;align-items:baseline;gap:10px;padding-bottom:8px;border-bottom:2px solid var(--ink);margin-bottom:4px}
.chap-h .n{font-family:var(--mono);color:var(--accent-ink);font-size:14px}
.chap-h h2{font-size:20px;flex:1}
.chap-h .sum{font-size:13px;color:var(--muted);white-space:nowrap}
.l2{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:baseline;padding:14px 8px 6px;border-bottom:1px solid var(--line)}
.l2 .n{font-family:var(--mono);font-size:13px;color:var(--accent-ink)}
.l2 .t{font-family:var(--display);font-weight:600;font-size:16px}
.l2 .meta{font-size:12px;color:var(--muted)}
.emptyline{font-size:12.5px;color:var(--muted);padding:8px 8px 8px 64px;border-bottom:1px solid var(--line);line-height:1.5}
.sub{display:grid;grid-template-columns:56px 1fr auto;padding-left:20px!important;gap:4px 12px;align-items:center;padding:12px 8px;border-bottom:1px solid var(--line);width:100%;text-align:left;background:none;border-left:none;border-right:none;border-top:none;border-radius:0}
.sub:hover{background:var(--surface)}
.sub .n{font-family:var(--mono);font-size:13px;color:var(--muted)}
.sub .t{font-weight:600}
.sub .meta{font-size:13px;color:var(--muted);text-align:right;white-space:nowrap}
.sub .bar{grid-column:2 / 4}
.sub.empty{cursor:default;opacity:.55}
.sub.empty:hover{background:none}
.bar{height:6px;border-radius:3px;background:var(--sunk);display:flex;overflow:hidden}
.bar i{display:block;height:100%}
.bar .f{background:var(--accent)} .bar .b{background:var(--accent-mid)}
.terms{grid-column:2 / 4;font-size:13px;color:var(--muted);line-height:1.4}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:4px 0 18px}
.tab{background:none;border:none;border-bottom:2px solid transparent;padding:10px 12px;font-weight:600;color:var(--muted);margin-bottom:-1px}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.theme{padding:16px 0;border-bottom:1px solid var(--line);display:grid;gap:8px}
.theme-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.theme-h h3{font-size:17px}
.theme .focus{font-size:15px;margin:0}
.theme .bar{max-width:240px}
.q{padding:16px 0;border-bottom:1px solid var(--line);display:grid;gap:10px}
.q .qstem{font-size:15px}
.q ol{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.q li{display:grid;grid-template-columns:22px 1fr;gap:8px;font-size:15px}
.q li .l{font-family:var(--mono);font-size:13px;color:var(--accent-ink);padding-top:2px}
.sol{display:block;font-size:14px;margin-top:3px;color:var(--muted)}
.sol b{font-weight:700}
.sol.t b{color:var(--ok)} .sol.f b{color:var(--bad)}
.sdot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-left:6px;vertical-align:1px;background:var(--sunk);border:1px solid var(--line)}
.sdot.bek{background:var(--accent-mid);border-color:var(--accent-mid)} .sdot.fest{background:var(--accent);border-color:var(--accent)}
.toggle{display:flex;align-items:center;gap:8px;font-size:14px;margin-bottom:6px}

/* chapter detail */
.back{margin-bottom:16px}
.detail-h{display:grid;gap:6px;margin-bottom:18px}
.detail-h .n{font-family:var(--mono);color:var(--accent-ink)}
.detail-h h1{font-size:28px}
.statgrid{display:flex;flex-wrap:wrap;gap:8px 22px;font-size:14px;margin:6px 0 16px}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:26px}
.tasklist{display:grid;gap:0;border-top:1px solid var(--line)}
.task{padding:12px 0;border-bottom:1px solid var(--line);display:grid;gap:4px}
.task .tt{font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:12px;padding:2px 8px;border-radius:999px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.chip.ex{background:var(--accent-soft);color:var(--accent-ink);font-weight:600}
.chip.o{background:var(--ok-soft);color:var(--ok)}
.chip.w{background:var(--warn-soft);color:var(--warn)}
h3.sec{font-size:16px;margin:26px 0 8px}

/* quiz */
.qhead{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px}
.qprog{flex:1;height:4px;background:var(--sunk);border-radius:2px;overflow:hidden}
.qprog i{display:block;height:100%;background:var(--accent);transition:width .25s}
.ctx{font-size:13px;color:var(--muted);margin-bottom:10px}
.stem{background:var(--sunk);border-radius:12px;padding:14px 16px;font-size:15px;color:var(--ink);margin-bottom:16px;max-height:40vh;overflow:auto}
.stmt{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:12px;padding:18px 18px;font-size:19px;line-height:1.45;box-shadow:var(--shadow);display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:start}
.stmt .letter{font-family:var(--mono);font-size:14px;color:var(--accent-ink);padding-top:4px}
.answer{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:18px}
.answer .btn{padding:16px;font-size:17px;border-width:2px}
.answer .btn:hover{border-color:var(--accent)}
.fb{margin-top:18px;border-radius:12px;padding:16px;display:grid;gap:10px}
.fb.ok{background:var(--ok-soft)} .fb.bad{background:var(--bad-soft)}
.fb .verdict{font-family:var(--display);font-weight:700;font-size:18px}
.fb.ok .verdict{color:var(--ok)} .fb.bad .verdict{color:var(--bad)}
.fb .why{font-size:15.5px}
.trap{background:var(--accent-soft);color:var(--ink);border-left:3px solid var(--accent);border-radius:8px;padding:10px 12px;font-size:14px}
.dispute{background:var(--warn-soft);color:var(--ink);border-radius:8px;padding:10px 12px;font-size:14px}
.dispute b{color:var(--warn)}
.fb-actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px;align-items:center}
.hint{font-size:12px;color:var(--muted);margin-top:14px}
kbd{font-family:var(--mono);font-size:11px;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 4px}

/* end */
.endcard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:24px;display:grid;gap:14px;box-shadow:var(--shadow)}
.endcard h2{font-size:24px}

.method{margin-top:36px;font-size:14.5px;color:var(--muted);display:grid;gap:10px;max-width:65ch}
.method h3{color:var(--ink);font-size:16px}
.method p{margin:0}
.settings{display:flex;flex-wrap:wrap;align-items:center;gap:10px;font-size:14px;margin-top:6px}
.settings input{font:inherit;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink)}
/* nav + Klausurthemen */
.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:20px}
.navb{background:none;border:none;border-bottom:3px solid transparent;padding:10px 14px;font-family:var(--display);font-weight:600;font-size:16px;color:var(--muted);margin-bottom:-1px}
.navb[aria-current="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.seg{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.segb{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-weight:600;font-size:14px;color:var(--muted)}
.segb[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.tfilter{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:8px}
.tfilter .wide{grid-column:1 / -1}
.tfilter input,.tfilter select{font:inherit;font-size:15px;width:100%;min-width:0;padding:9px 10px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink)}
.tcount{font-size:13px;color:var(--muted);margin-bottom:18px}
.l3{display:grid;grid-template-columns:56px 1fr auto;gap:12px;align-items:baseline;padding:10px 8px 4px 20px;font-size:14px;font-weight:600}
.l3 .n{font-family:var(--mono);font-size:13px;color:var(--muted);font-weight:500}
.trow{display:grid;grid-template-columns:1fr auto 44px 42px;gap:10px;align-items:center;width:100%;text-align:left;background:none;border:none;border-bottom:1px solid var(--line);border-radius:0;padding:9px 8px 9px 32px;font-size:15px}
.trow:hover{background:var(--surface)}
.trow .t{min-width:0}
.trow .o{font-family:var(--mono);font-size:12px;color:var(--muted)}
.trow .fq{height:6px;border-radius:3px;background:var(--sunk);overflow:hidden}
.trow .fq i{display:block;height:100%;background:var(--accent)}
.trow .p{font-family:var(--mono);font-size:13px;text-align:right;color:var(--accent-ink);font-variant-numeric:tabular-nums}
.trow.zero .t,.trow.zero .p{color:var(--muted)}
.trow.flat{padding-left:8px}
.tdet{padding:8px 8px 14px 32px;border-bottom:1px solid var(--line);font-size:14px;color:var(--muted);display:grid;gap:8px;max-width:65ch}
.tdet.flat{padding-left:8px}
.tdet p{margin:0}
.tnone{font-size:12.5px;color:var(--muted);padding:6px 8px 8px 32px;border-bottom:1px solid var(--line)}
@media (max-width:520px){
  .tfilter{grid-template-columns:1fr}
  .l3{grid-template-columns:44px 1fr auto;padding-left:8px}
  .trow{padding-left:14px;grid-template-columns:1fr auto 32px 40px}
  .tdet,.tnone{padding-left:14px}
}

@media (max-width:520px){
  .stmt{font-size:17px;padding:16px}
  .bigfig{font-size:34px}
  .sub{grid-template-columns:38px 1fr}
  .sub .meta{grid-column:2;text-align:left}
  .sub .bar{grid-column:2}
}

/* Auswahl */
.selhead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.selhead .label{margin:0}
.ck{width:18px;height:18px;accent-color:var(--accent);margin:0;cursor:pointer;flex:none}
.sub.selrow{cursor:pointer}
.sub.selrow .n{display:flex;align-items:center;gap:8px}
.sub.selrow.on{background:var(--accent-soft)}
.l2 .n.ckn,.chap-h .ckn{display:flex;align-items:center;gap:8px}
.selbar{position:fixed;left:0;right:0;bottom:0;z-index:8;background:var(--surface);border-top:1px solid var(--line);box-shadow:0 -4px 16px rgba(20,30,50,.08);padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px))}
.selbar .in{max-width:760px;margin:0 auto;display:grid;gap:10px}
.selbar .sum{font-size:14px}
.selbar .sum b{font-family:var(--mono);font-weight:500}
.selbar .row{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center}
.selbar .btn{padding:9px 14px;font-size:15px}
body.hasbar{padding-bottom:190px}
/* Klausuren */
.exgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-bottom:26px}
.excard{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;text-align:left;display:grid;gap:6px}
.excard:hover{border-color:var(--accent)}
.excard .t{font-family:var(--display);font-weight:700;font-size:17px}
.excard .m{font-size:12.5px;color:var(--muted)}
.arow{display:grid;grid-template-columns:34px 1fr auto;gap:4px 12px;align-items:baseline;width:100%;text-align:left;background:none;border:none;border-bottom:1px solid var(--line);border-radius:0;padding:11px 8px}
.arow:hover{background:var(--surface)}
.arow .nr{font-family:var(--mono);font-size:13px;color:var(--accent-ink)}
.arow .tp{font-weight:600}
.arow .sx{font-family:var(--mono);font-size:12px;color:var(--muted);white-space:nowrap}
.arow .dots{grid-column:2 / 4;display:flex;gap:0}
.arow .dots .sdot{margin-left:0;margin-right:5px}
.adet{padding:4px 8px 16px 54px;border-bottom:1px solid var(--line)}
.adet .q{border-bottom:none;padding-top:6px}
.exref{font-size:12.5px;color:var(--muted);font-family:var(--mono)}
.hit{display:block;width:100%;text-align:left;background:none;border:none;border-bottom:1px solid var(--line);border-radius:0;padding:10px 8px;display:grid;gap:3px}
.hit:hover{background:var(--surface)}
.hit .exref{color:var(--accent-ink)}
.hit .tx{font-size:14.5px}
/* Fundstellen */
.fund{display:grid;gap:6px;font-size:14px;margin-top:4px}
.fund .fh{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.fref{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;align-items:baseline}
.fref .k{font-family:var(--mono);font-size:12px;color:var(--accent-ink);white-space:nowrap}
.fref .v{min-width:0}
.fref .v a{color:var(--ink);text-underline-offset:3px}
.fref .ex{grid-column:2;color:var(--muted);font-size:13px;line-height:1.45}
.sol .fund{margin-top:6px}
.secfund{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:22px}
@media (max-width:520px){ .adet{padding-left:8px} .selbar .btn{flex:1 1 40%;padding:8px 10px;font-size:14px} }

.pace{display:grid;gap:8px}
.pacebar{position:relative;padding:4px 0}
.pacebar .soll{position:absolute;top:0;bottom:0;width:2px;margin-left:-1px;background:var(--ink);border-radius:1px}
.pacetext{font-size:14px;color:var(--muted)}
.pacetext b{color:var(--ink);font-weight:600}
.mlist{display:grid;gap:10px}
.mrow{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:12px;padding:14px;display:grid;gap:12px;box-shadow:var(--shadow)}
.mrow.ok{border-left-color:var(--ok)} .mrow.bad{border-left-color:var(--bad)}
.mrow .mt{display:grid;grid-template-columns:auto 1fr;gap:10px;font-size:16.5px;line-height:1.45}
.mrow .mt .letter{font-family:var(--mono);font-size:13px;color:var(--accent-ink);padding-top:3px}
.mrow .rf{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mrow .rf .btn{padding:9px;border-width:2px}
.mrow .rf .btn[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.mfb{display:grid;gap:8px;font-size:15px}
.mfb .v{font-family:var(--display);font-weight:700}
.mfb .okc{color:var(--ok)} .mfb .badc{color:var(--bad)}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>

<div class="wrap">
  <header class="top">
    <div class="brand">M1 <span>·</span> Klausurtrainer</div>
    <div class="sync" id="sync">lädt …</div>
  </header>
  <nav class="nav" id="nav" aria-label="Bereiche"><button class="navb" data-go="home">Trainer</button><button class="navb" data-go="themen">Klausurthemen</button><button class="navb" data-go="klausuren">Klausuren</button></nav>
  <div id="selbar" class="selbar" hidden></div>
  <main id="app"><section id="lock" class="lockbox" hidden>
  <h2>Schlüssel eingeben</h2>
  <p class="muted">Füge deinen Hub-Schlüssel oder den ganzen Link ein. Danach merkt sich das Gerät ihn.</p>
  <input id="lockIn" type="password" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Schlüssel">
  <p id="lockErr" class="lockerr" hidden></p>
  <button id="lockGo" class="btn">Öffnen</button>
</section><p id="loadMsg" class="muted">lädt …</p></main>
</div>

<style>
.lockbox{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px;margin-top:24px;display:grid;gap:12px}
.lockbox input{font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
.lockerr{color:var(--bad);margin:0}
</style>
<script>
(function(){
"use strict";
const $ = id => document.getElementById(id);
const LS = { get(k){ try { return localStorage.getItem(k) || ""; } catch(e){ return ""; } }, set(k,v){ try { localStorage.setItem(k,v); } catch(e){} }, del(k){ try { localStorage.removeItem(k); } catch(e){} } };
if ("serviceWorker" in navigator) navigator.serviceWorker.register("../sw.js").catch(()=>{});
const u8 = b => Uint8Array.from(atob(b), c => c.charCodeAt(0));
async function open(key){
  const r = await fetch("data.enc", {cache:"no-cache"});
  if (!r.ok) throw new Error("net");
  const p = await r.json();
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(key), "PBKDF2", false, ["deriveKey"]);
  const k = await crypto.subtle.deriveKey({name:"PBKDF2", hash:"SHA-256", salt:u8(p.salt), iterations:p.iter}, base, {name:"AES-GCM", length:256}, false, ["decrypt"]);
  let plain;
  try { plain = await crypto.subtle.decrypt({name:"AES-GCM", iv:u8(p.iv)}, k, u8(p.data)); } catch(e){ throw new Error("key"); }
  return JSON.parse(new TextDecoder().decode(plain));
}
function start(b){
  for (const id of ["data","fund","topics"]){ const s = document.createElement("script"); s.type = "application/json"; s.id = id; s.textContent = JSON.stringify(b[id]); document.body.appendChild(s); }
  window.KT_SEED = b.seed || null;
  $("app").innerHTML = "";
  const s = document.createElement("script"); s.src = "app.js?v=ed7b5e11c9"; document.body.appendChild(s);
}
function ask(msg){
  $("loadMsg").hidden = true; $("lock").hidden = false; $("sync").textContent = "gesperrt";
  if (msg){ $("lockErr").textContent = msg; $("lockErr").hidden = false; }
}
async function tryKey(key, fromUser){
  $("loadMsg").hidden = false; $("lock").hidden = true;
  try {
    const b = await open(key);
    LS.set("kt-key", key); LS.set("hub-key", key);
    start(b);
  } catch(e){
    if (e.message === "key"){ LS.del("kt-key"); ask(fromUser ? "Der Schlüssel passt nicht." : "Der gespeicherte Schlüssel passt nicht mehr."); }
    else ask("Die Daten ließen sich nicht laden. Bist du offline? Beim ersten Öffnen braucht die App Netz.");
  }
}
function parse(v){ v = (v||"").trim(); const m = /[?&]k=([^&#\s]+)/.exec(v); return m ? decodeURIComponent(m[1]) : v; }
$("lockGo").onclick = () => { const v = parse($("lockIn").value); if (v) tryKey(v, true); };
$("lockIn").addEventListener("keydown", e => { if (e.key === "Enter") $("lockGo").click(); });
const k = new URLSearchParams(location.search).get("k") || LS.get("kt-key");
if (k) tryKey(k, false); else ask("");
})();
</script>
</body></html>
